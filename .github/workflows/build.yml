name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

# Si subes otro cambio mientras compila, se cancela la compilación anterior.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Runner alojado por GitHub: ya trae el SDK de Android, git, unzip y curl.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Pruebas unitarias
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Descargar-Multimedia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Descargar-Multimedia-apk
          path: Descargar-Multimedia.apk
          retention-days: 30

  release:
    # Solo cuando subes una etiqueta que empieza con "v" (por ejemplo v1.0).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Descargar-Multimedia-apk

      - uses: softprops/action-gh-release@v2
        with:
          files: Descargar-Multimedia.apk
